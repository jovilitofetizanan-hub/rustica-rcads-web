<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rustica RCADS QR Test</title>
<meta name="theme-color" content="#5b3a22">
<style>
body{font-family:Arial,sans-serif;background:#f6efe5;margin:0;color:#2d2118}
main{max-width:760px;margin:32px auto;padding:20px}
.card{background:#fff;border:1px solid #dbc8b1;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{margin:0 0 8px;color:#5b3a22}
label{display:block;font-weight:700;margin:14px 0 6px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #c9b9a6;border-radius:9px}
button{padding:11px 14px;border:0;border-radius:9px;font-weight:800;cursor:pointer}
.primary{background:#6e4a2c;color:white}.secondary{background:#1f6b4f;color:white}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#qr{margin-top:18px;display:flex;justify-content:center;min-height:220px;align-items:center;border:1px dashed #cbb89f;border-radius:12px;background:#fffaf3}
.code{font-size:12px;word-break:break-all;background:#faf6ef;padding:10px;border-radius:8px;margin-top:10px}
.note{font-size:13px;color:#6f5b49;margin-top:10px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>RCADS QR + Personal Link Test</h1>
<p>This test uses the permanent HTTPS RCADS web address. QR and personal link open the same target.</p>

<label>Person / Role</label>
<input id="person" value="OWNER 1 - MS. VANGIE BALINGIT">

<label>RCADS Code</label>
<input id="code" value="OWNER1">

<div class="row">
<button class="primary" id="make">CREATE QR + LINK</button>
<button class="secondary" id="copy">COPY LINK</button>
<button class="secondary" id="open">OPEN LINK</button>
</div>

<div id="qr">Create the QR first.</div>
<div class="code" id="linkBox"></div>
<div class="note">If QR scanning fails, use COPY LINK and send the same personal link to the phone.</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const base = location.origin + location.pathname;
let currentLink = "";

function token(){
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('');
}

function build(){
  const person = document.getElementById('person').value.trim();
  const code = document.getElementById('code').value.trim();
  const expires = Date.now() + 2*60*1000;
  const t = token();
  const u = new URL(base);
  u.searchParams.set('rcadsAccess', t);
  u.searchParams.set('role', 'OWNER');
  u.searchParams.set('code', code);
  u.searchParams.set('name', person);
  u.searchParams.set('exp', String(expires));
  currentLink = u.toString();

  const q = document.getElementById('qr');
  q.innerHTML = '';
  new QRCode(q, {
    text: currentLink,
    width: 220,
    height: 220,
    correctLevel: QRCode.CorrectLevel.M
  });
  document.getElementById('linkBox').textContent = currentLink;
}

document.getElementById('make').onclick = build;
document.getElementById('copy').onclick = async()=>{
  if(!currentLink) build();
  try { await navigator.clipboard.writeText(currentLink); alert('Personal RCADS link copied.'); }
  catch(e){ prompt('Copy this RCADS link:', currentLink); }
};
document.getElementById('open').onclick = ()=>{
  if(!currentLink) build();
  window.open(currentLink,'_blank','noopener');
};

const p = new URLSearchParams(location.search);
if(p.has('rcadsAccess')){
  document.querySelector('.card').innerHTML =
    '<h1>RCADS ACCESS RECEIVED</h1>' +
    '<p><strong>'+ (p.get('name')||'Selected user') +'</strong></p>' +
    '<p>Role: '+(p.get('role')||'')+'</p>' +
    '<p>Code: '+(p.get('code')||'')+'</p>' +
    '<p class="note">HTTPS personal-link routing is working. Next step is connecting this route to the real locked RCADS personal screen and PIN verification.</p>';
}
</script>
</body>
</html>
